name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --reporter expanded
      - name: Build Android ARM64 APK (development signed)
        env:
          GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx3g
        run: flutter build apk --release --target-platform android-arm64
      - name: Prepare Android build artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/hermes-mobile-development-arm64.apk
          cd dist
          sha256sum hermes-mobile-development-arm64.apk > SHA256SUMS.txt
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-android-arm64-development
          path: dist/*
          if-no-files-found: error
          retention-days: 14
